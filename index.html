<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0e12" />
  <meta name="description" content="DRONE STRIKE — arcade FPV strike-drone simulator in your browser." />
  <title>DRONE STRIKE — FPV Simulator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1016'/%3E%3Cpath d='M32 8 L44 44 L32 36 L20 44 Z' fill='%23ffc23d'/%3E%3Ccircle cx='32' cy='26' r='4' fill='%230b1016'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #06090d; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #06090d; color: #7fd0ff; font-family: 'Share Tech Mono', monospace; z-index: 999;
      flex-direction: column; gap: 18px; transition: opacity .4s; }
    #boot .boot-title { letter-spacing: .5em; font-size: 15px; opacity: .85; }
    #boot .boot-bar { width: 220px; height: 3px; background: #14202b; border-radius: 2px; overflow: hidden; }
    #boot .boot-bar i { display: block; height: 100%; width: 40%; background: #7fd0ff; border-radius: 2px;
      animation: bootslide 1s ease-in-out infinite alternate; }
    @keyframes bootslide { from { transform: translateX(-60%); } to { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-title">DRONE STRIKE</div>
    <div class="boot-bar"><i></i></div>
    <div id="boot-msg" style="font-size:11px;opacity:.5;letter-spacing:.2em;">INITIALIZING FLIGHT SYSTEMS</div>
  </div>
  <canvas id="game-canvas"></canvas>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
